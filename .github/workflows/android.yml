name: Android

on:
  push:
    paths: ["android/**", "zkp/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bygg:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Bygg bevismotoren
        working-directory: zkp
        run: |
          npm ci --no-audit --no-fund
          UT=../android/pass/src/main/assets/zkp npm run bygg
      - name: Bygg
        env:
          NOKKEL_BASE64: ${{ secrets.NOKKEL_BASE64 }}
          NOKKEL_ALIAS: ${{ secrets.NOKKEL_ALIAS }}
          NOKKEL_PASSORD: ${{ secrets.NOKKEL_PASSORD }}
        run: |
          echo "$NOKKEL_BASE64" | base64 -d > "$RUNNER_TEMP/apper.keystore"
          export NOKKEL_FIL="$RUNNER_TEMP/apper.keystore"
          moduler=$(python3 -c "import json; print(' '.join(a['modul'] for a in json.load(open('apper.json'))))")
          args=""
          for m in $moduler; do
            ekstra=""; [ "$m" = pass ] && ekstra="../zkp"
            args="$args -Pversjon.$m=$(git rev-list --count HEAD -- $m felles $ekstra)"
          done
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease $args
          mkdir -p ut
          python3 - <<'PY'
          import json, shutil, subprocess
          apper = json.load(open("apper.json"))
          for a in apper:
              m = a["modul"]
              stier = [m, "felles"] + (["../zkp"] if m == "pass" else [])
              teller = subprocess.check_output(["git", "rev-list", "--count", "HEAD", "--", *stier], text=True).strip()
              a["versjon"] = 100 + int(teller)
              a["apk"] = f"{m}.apk"
              shutil.copy(f"{m}/build/outputs/apk/release/{m}-release.apk", f"ut/{m}.apk")
          json.dump(apper, open("ut/apper.json", "w"), ensure_ascii=False, indent=2)
          PY
      - name: Last opp
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view siste >/dev/null 2>&1 || gh release create siste --title "Siste" --notes "Bygges på nytt ved hver push."
          gh release upload siste ut/* --clobber
