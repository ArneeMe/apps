name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bygg:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Bygg
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: ./gradlew --no-daemon assembleDebug
      - name: Bygg utgivelse
        if: startsWith(github.ref, 'refs/tags/')
        env:
          NOKKEL_BASE64: ${{ secrets.NOKKEL_BASE64 }}
          NOKKEL_ALIAS: ${{ secrets.NOKKEL_ALIAS }}
          NOKKEL_PASSORD: ${{ secrets.NOKKEL_PASSORD }}
          VERSJON: ${{ github.ref_name }}
        run: |
          echo "$NOKKEL_BASE64" | base64 -d > "$RUNNER_TEMP/verktoy.keystore"
          export NOKKEL_FIL="$RUNNER_TEMP/verktoy.keystore"
          export VERSJON="${VERSJON#v}"
          ./gradlew --no-daemon assembleRelease
      - name: Last opp
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "verktoy-${{ github.ref_name }}.apk"
          gh release create "${{ github.ref_name }}" "verktoy-${{ github.ref_name }}.apk" --title "${{ github.ref_name }}" --generate-notes
