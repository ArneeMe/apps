name: Android

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bygg:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Bygg
        env:
          NOKKEL_BASE64: ${{ secrets.NOKKEL_BASE64 }}
          NOKKEL_ALIAS: ${{ secrets.NOKKEL_ALIAS }}
          NOKKEL_PASSORD: ${{ secrets.NOKKEL_PASSORD }}
        run: |
          echo "$NOKKEL_BASE64" | base64 -d > "$RUNNER_TEMP/verktoy.keystore"
          export NOKKEL_FIL="$RUNNER_TEMP/verktoy.keystore"
          ./gradlew --no-daemon assembleRelease
      - name: Last opp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk verktoy.apk
          gh release view siste >/dev/null 2>&1 || gh release create siste --title "Siste" --notes "Bygges på nytt ved hver push."
          gh release upload siste verktoy.apk --clobber
